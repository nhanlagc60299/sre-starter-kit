image: docker:27
services: [docker:27-dind]
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  SMOKE_HOST: docker
before_script:
  - apk add --no-cache bash make curl python3 py3-yaml gettext git
stages: [test]
static:
  stage: test
  script:
    - make validate
    - make test-rules
    - bash tests/test_render.sh
    - bash tests/test_init.sh
smoke:
  stage: test
  script:
    - make smoke
