apiVersion: 1
providers:
  - name: sre-kit
    folder: SRE Kit
    type: file
    disableDeletion: false
    allowUiUpdates: false   # dashboards come from core/; UI edits would be silently reverted on re-provision
    options: { path: /var/lib/grafana/dashboards, foldersFromFilesStructure: false }
