groups:
  - name: infra
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical, module: infra }
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#nodedown

      - alert: DiskFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 < 5
        for: 2m
        labels: { severity: critical, module: infra }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} has {{ $value | printf \"%.0f\" }}% free"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#diskfull

      - alert: DiskLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 < 15
        for: 10m
        labels: { severity: warning, module: infra }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} has {{ $value | printf \"%.0f\" }}% free"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#disklow

      - alert: DiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 30m
        labels: { severity: warning, module: infra }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24h"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#diskwillfillin24h

      - alert: HighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels: { severity: warning, module: infra }
        annotations:
          summary: "CPU on {{ $labels.instance }} above 85% for 15m"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#highcpu

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels: { severity: warning, module: infra }
        annotations:
          summary: "Memory on {{ $labels.instance }} above 90% for 10m"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#highmemory

      # cAdvisor can be up, healthy, scraped, and still know nothing about your containers.
      # Docker 29 defaults to the containerd image store, which removes the layerdb that older
      # cAdvisor builds read to identify a container; every container then fails registration and
      # only host cgroups are reported. The target stays UP and the series keep flowing, so
      # nothing looks wrong -- measured on Docker 29.2.1, where cAdvisor v0.52.1 produced 1857
      # container_* series and not one of them named a container.
      #
      # `absent()` rather than `count(...) == 0`: an empty selector makes count() return no series
      # at all, so the comparison would never be true and this alert would never fire.
      # The `up == 1` guard keeps it quiet for anyone running without the cadvisor profile.
      - alert: ContainerMetricsMissing
        expr: up{job="cadvisor"} == 1 and on() absent(container_memory_working_set_bytes{name!=""})
        for: 5m
        labels: { severity: critical, module: infra }
        annotations:
          summary: "cAdvisor is up but reporting no containers; every container alert is blind"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#containermetricsmissing

      # Warn before the kernel kills it, not after. cAdvisor only reports containers that are
      # RUNNING, so a container that is OOM-killed leaves the metrics entirely and its
      # container_oom_events_total is never observed -- measured on Docker 29.2.1, where a real
      # OOM kill left every oom counter at 0. Memory approaching the limit is visible while the
      # container is still alive, which is also while it can still be fixed.
      #
      # The `> 0` on the limit is load-bearing: a container started without --memory reports a
      # limit of 0, and dividing by it yields +Inf, which would fire for every unlimited
      # container on the host. Filtering first means those series are simply absent.
      - alert: ContainerMemoryNearLimit
        expr: container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.8
        for: 10m
        labels: { severity: warning, module: infra }
        annotations:
          summary: "Container {{ $labels.name }} is at {{ $value | humanizePercentage }} of its memory limit"
          runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#containermemorynearlimit
