rule_files:
  - /p/rules/infra.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="n1"}'
        values: '0x5'
      - series: 'node_filesystem_avail_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '4x5'
      - series: 'node_filesystem_size_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '100x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: NodeDown
        exp_alerts:
          - exp_labels: { severity: critical, module: infra, job: node, instance: n1 }
            exp_annotations:
              summary: "Node n1 is down"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#nodedown
      - eval_time: 5m
        alertname: DiskFull
        exp_alerts:
          - exp_labels: { severity: critical, module: infra, job: node, instance: n1, mountpoint: "/", fstype: ext4 }
            exp_annotations:
              summary: "Disk / on n1 has 4% free"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#diskfull
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '50x5'
      - series: 'node_filesystem_size_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '100x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: DiskFull
        exp_alerts: []
      - eval_time: 5m
        alertname: DiskLow
        exp_alerts: []
  # ContainerMemoryNearLimit. Four containers, one per case:
  #   hog      - 85% of a real limit, must fire
  #   steady   - 50% of a real limit, must not
  #   nolimit  - real usage but a limit of 0, which is what cAdvisor reports for a container
  #              started without --memory. Dividing by it yields +Inf, so without the `> 0`
  #              filter this container fires for ever. Measured on Docker 29.2.1.
  #   spike    - crosses the threshold briefly, then falls back. `for: 10m` must swallow it.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="hog"}'
        values: '57000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="hog"}'
        values: '67108864x20'
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="steady"}'
        values: '33000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="steady"}'
        values: '67108864x20'
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="nolimit"}'
        values: '900000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="nolimit"}'
        values: '0x20'
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="spike"}'
        values: '33000000 33000000 57000000 57000000 33000000x16'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="spike"}'
        values: '67108864x20'
    alert_rule_test:
      # Inside the 10m pending window: nothing may fire yet, which is what proves `for:` is real.
      - eval_time: 5m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      # Past it: only hog. steady is under the threshold, nolimit is filtered by `> 0`, and
      # spike fell back long before its pending window elapsed.
      - eval_time: 15m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels: { severity: warning, module: infra, job: cadvisor, name: hog }
            exp_annotations:
              summary: "Container hog is at 84.94% of its memory limit"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#containermemorynearlimit
