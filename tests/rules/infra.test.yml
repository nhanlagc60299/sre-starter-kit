rule_files:
  - /p/rules/infra.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="n1"}'
        values: '0x5'
      - series: 'node_filesystem_avail_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '4x5'
      - series: 'node_filesystem_size_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '100x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: NodeDown
        exp_alerts:
          - exp_labels: { severity: critical, module: infra, job: node, instance: n1 }
            exp_annotations:
              summary: "Node n1 is down"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#nodedown
      - eval_time: 5m
        alertname: DiskFull
        exp_alerts:
          - exp_labels: { severity: critical, module: infra, job: node, instance: n1, mountpoint: "/", fstype: ext4 }
            exp_annotations:
              summary: "Disk / on n1 has 4% free"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#diskfull
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '50x5'
      - series: 'node_filesystem_size_bytes{job="node",instance="n1",mountpoint="/",fstype="ext4"}'
        values: '100x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: DiskFull
        exp_alerts: []
      - eval_time: 5m
        alertname: DiskLow
        exp_alerts: []
  # ContainerMemoryNearLimit. Four containers, one per case:
  #   hog      - 85% of a real limit, must fire
  #   steady   - 50% of a real limit, must not
  #   nolimit  - real usage but a limit of 0, which is what cAdvisor reports for a container
  #              started without --memory. Dividing by it yields +Inf, so without the `> 0`
  #              filter this container fires for ever. Measured on Docker 29.2.1.
  #   spike    - crosses the threshold briefly, then falls back. `for: 10m` must swallow it.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="hog"}'
        values: '57000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="hog"}'
        values: '67108864x20'
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="steady"}'
        values: '33000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="steady"}'
        values: '67108864x20'
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="nolimit"}'
        values: '900000000x20'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="nolimit"}'
        values: '0x20'
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="spike"}'
        values: '33000000 33000000 57000000 57000000 33000000x16'
      - series: 'container_spec_memory_limit_bytes{job="cadvisor",name="spike"}'
        values: '67108864x20'
    alert_rule_test:
      # Inside the 10m pending window: nothing may fire yet, which is what proves `for:` is real.
      - eval_time: 5m
        alertname: ContainerMemoryNearLimit
        exp_alerts: []
      # Past it: only hog. steady is under the threshold, nolimit is filtered by `> 0`, and
      # spike fell back long before its pending window elapsed.
      - eval_time: 15m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels: { severity: warning, module: infra, job: cadvisor, name: hog }
            exp_annotations:
              summary: "Container hog is at 84.94% of its memory limit"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#containermemorynearlimit
  # ContainerMetricsMissing. The failure it exists for is silent: cAdvisor up, target UP, series
  # flowing, and not one of them naming a container. Three blocks, because the two ways to get
  # this wrong are opposite -- never firing, and firing at everyone who runs without cAdvisor.
  #
  # (a) cAdvisor up, reporting only host cgroups: must fire, but only after `for: 5m`.
  #     The id-only series are not padding. A broken host emits plenty of container_* series --
  #     1857 of them, measured -- all of them host cgroups with no name label. An alert selector
  #     without `name!=""` sees those, concludes all is well, and never fires on the one failure
  #     it exists for. These two series are what make that mistake turn this test red.
  - interval: 1m
    input_series:
      - series: 'up{job="cadvisor",instance="cadvisor:8080"}'
        values: '1x10'
      - series: 'container_memory_working_set_bytes{job="cadvisor",id="/"}'
        values: '500000000x10'
      - series: 'container_memory_working_set_bytes{job="cadvisor",id="/system.slice/docker.service"}'
        values: '17000000x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: ContainerMetricsMissing
        exp_alerts: []
      - eval_time: 8m
        alertname: ContainerMetricsMissing
        exp_alerts:
          - exp_labels: { severity: critical, module: infra, job: cadvisor, instance: "cadvisor:8080" }
            exp_annotations:
              summary: "cAdvisor is up but reporting no containers; every container alert is blind"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#containermetricsmissing
  # (b) cAdvisor up and reporting a container: must stay quiet. This is the case that fails if
  #     anyone rewrites absent() into a count() comparison the wrong way round.
  - interval: 1m
    input_series:
      - series: 'up{job="cadvisor",instance="cadvisor:8080"}'
        values: '1x10'
      - series: 'container_memory_working_set_bytes{job="cadvisor",name="api"}'
        values: '1000x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: ContainerMetricsMissing
        exp_alerts: []
  # (c) cAdvisor not running at all -- a supported setup, since Podman hosts leave the profile
  #     empty and the README promises they will not be paged for it. Must stay quiet, or every
  #     Podman user is paged for a choice the product told them to make.
  - interval: 1m
    input_series:
      - series: 'up{job="cadvisor",instance="cadvisor:8080"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: ContainerMetricsMissing
        exp_alerts: []
  # ContainerRestartLoop. `looper` restarts every 3m; `steadyup` starts once and stays up. The
  # start_time values are what cAdvisor v0.60.5 actually publishes -- v0.52.1 froze this series at
  # the first start, which is why this rule was removed and why it works again now.
  - interval: 1m
    input_series:
      - series: 'container_start_time_seconds{job="cadvisor",name="looper"}'
        values: '1000 1000 1000 1180 1180 1180 1360 1360 1360 1540 1540 1540 1720 1720 1720 1720'
      - series: 'container_start_time_seconds{job="cadvisor",name="steadyup"}'
        values: '1000x15'
      # A host cgroup, which cAdvisor publishes with an id and no name. This one moves as often
      # as `looper` does -- a Docker daemon restarting in a loop does exactly this. Without
      # `name!=""` the rule fires on it and pages about a container whose name renders empty.
      - series: 'container_start_time_seconds{job="cadvisor",id="/system.slice/docker.service"}'
        values: '900 900 900 1080 1080 1080 1260 1260 1260 1440 1440 1440 1620 1620 1620 1620'
    alert_rule_test:
      # The threshold, both sides of it, one minute apart. At 11m the window holds exactly three
      # restarts and >3 must mean it. At 12m the fourth lands and it fires. An assertion that
      # passes at several thresholds is not testing the threshold.
      - eval_time: 11m
        alertname: ContainerRestartLoop
        exp_alerts: []
      - eval_time: 12m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels: { severity: critical, module: infra, job: cadvisor, name: looper }
            exp_annotations:
              summary: "Container looper restarted >3 times in 15m"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#containerrestartloop
  # ContainerAtMemoryCeiling. `pinned` hits its limit continuously; `blip` hits it once and stops,
  # which is the healthy case this must not page for. Counter values, so the series only ever rise.
  - interval: 1m
    input_series:
      - series: 'container_memory_events_max_total{job="cadvisor",name="pinned"}'
        values: '0+40x30'
      # A host cgroup under a systemd MemoryMax, published by cAdvisor with an id and no name --
      # 34 of the 37 series of this metric on a real host carry no name. It presses its ceiling
      # exactly like `pinned` does, so without `name!=""` this rule pages about a container whose
      # name renders empty.
      - series: 'container_memory_events_max_total{job="cadvisor",id="/system.slice/docker.service"}'
        values: '0+40x30'
      - series: 'container_memory_events_max_total{job="cadvisor",name="blip"}'
        values: '0 0 0 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12 12'
    alert_rule_test:
      # Inside the pending window nothing fires, which is what makes `for: 15m` real.
      - eval_time: 10m
        alertname: ContainerAtMemoryCeiling
        exp_alerts: []
      # Past it, only the container that never stopped. blip's rate fell back to zero long before
      # its pending window could elapse.
      - eval_time: 25m
        alertname: ContainerAtMemoryCeiling
        exp_alerts:
          - exp_labels: { severity: warning, module: infra, job: cadvisor, name: pinned }
            exp_annotations:
              summary: "Container pinned has been hitting its memory limit for 15m"
              runbook_url: https://github.com/nhanlagc60299/sre-starter-kit/blob/main/docs/ALERTS.md#containeratmemoryceiling
