# Runs the stack from ../build (output of scripts/render.sh). Do not put config here.
name: sre-kit
x-restart: &restart { restart: unless-stopped }

services:
  prometheus:
    <<: *restart
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE}
      - --web.enable-lifecycle
    volumes:
      - ../build/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes:
      - ../build/alertmanager:/etc/alertmanager:ro
      - am-data:/alertmanager
    ports: ["9093:9093"]

  node-exporter:
    <<: *restart
    image: prom/node-exporter:v1.9.1
    command: [--path.rootfs=/host]
    pid: host
    volumes: ["/:/host:ro,rslave"]

  cadvisor:
    <<: *restart
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  blackbox:
    <<: *restart
    image: prom/blackbox-exporter:v0.26.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes: ["../build/blackbox:/etc/blackbox:ro"]

  loki:
    <<: *restart
    image: grafana/loki:3.5.0
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ../build/loki:/etc/loki:ro
      - loki-data:/loki
    ports: ["3100:3100"]

  alloy:
    <<: *restart
    image: grafana/alloy:v1.9.0
    command: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345]
    volumes:
      - ../build/loki/config.alloy:/etc/alloy/config.alloy:ro
      - ${CONTAINER_SOCK}:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    <<: *restart
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../build/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../build/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]

volumes: { prom-data: {}, am-data: {}, loki-data: {}, alloy-data: {}, grafana-data: {} }
