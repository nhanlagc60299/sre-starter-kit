# Runs the stack from ../build (output of scripts/render.sh). Do not put config here.
name: sre-kit
x-restart: &restart { restart: unless-stopped }

services:
  prometheus:
    <<: *restart
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE}
      - --web.enable-lifecycle
    volumes:
      - ../build/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["${BIND_ADDR:-127.0.0.1}:9090:9090"]
    # node-exporter runs in the host netns and so has no compose-network DNS name. Pointing the
    # name at the host gateway keeps the scrape target - and the instance label on every existing
    # series - identical to what it was when node-exporter was an ordinary compose service.
    extra_hosts: ["node-exporter:host-gateway"]

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, "--web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}"]
    volumes:
      - ../build/alertmanager:/etc/alertmanager:ro
      - am-data:/alertmanager
    ports: ["${BIND_ADDR:-127.0.0.1}:9093:9093"]

  node-exporter:
    <<: *restart
    image: prom/node-exporter:v1.9.1
    command: [--path.rootfs=/host]
    # Host network namespace, deliberately. /proc/net resolves through /proc/self/net and is
    # netns-scoped at read time, so without this every node_network_* series describes this
    # container's own veth rather than the machine's NICs. Mounting the host / at /host does not
    # fix it; only sharing the namespace does. The Node dashboard ships a Network Traffic row
    # built on those counters, so they have to be real.
    # The cost: 9100 is bound on the host (it can collide with an existing node-exporter) on all
    # interfaces, ignoring BIND_ADDR - the host netns is the whole point. See README "Exposure".
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]

  cadvisor:
    <<: *restart
    image: ghcr.io/google/cadvisor:v0.60.5
    profiles: [cadvisor]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  blackbox:
    <<: *restart
    image: prom/blackbox-exporter:v0.26.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes: ["../build/blackbox:/etc/blackbox:ro"]

  loki:
    <<: *restart
    image: grafana/loki:3.5.0
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ../build/loki:/etc/loki:ro
      - loki-data:/loki
    ports: ["${BIND_ADDR:-127.0.0.1}:3100:3100"]

  alloy:
    <<: *restart
    image: grafana/alloy:v1.9.0
    command: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy/data]
    volumes:
      - ../build/loki/config.alloy:/etc/alloy/config.alloy:ro
      - ${CONTAINER_SOCK}:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    <<: *restart
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../build/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../build/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["${BIND_ADDR:-127.0.0.1}:3000:3000"]

  triage-agent:
    <<: *restart
    image: python:3.12-alpine
    profiles: [triage]
    command: ["python3", "-u", "/app/triage_agent.py"]
    volumes:
      - ../scripts/triage_agent.py:/app/triage_agent.py:ro
      - ../docs/ALERTS.md:/docs/ALERTS.md:ro
    environment:
      PROJECT_NAME: "${PROJECT_NAME:-}"
      TRIAGE_DRY_RUN: "${TRIAGE_DRY_RUN:-true}"
      TRIAGE_REDACT: "${TRIAGE_REDACT:-}"
      GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TEAMS_WEBHOOK_URL: "${TEAMS_WEBHOOK_URL:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    # No port published: Alertmanager reaches it at triage-agent:9096 inside the compose network.

volumes: { prom-data: {}, am-data: {}, loki-data: {}, alloy-data: {}, grafana-data: {} }
